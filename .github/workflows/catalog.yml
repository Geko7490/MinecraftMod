name: Validate and publish mod catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: mod-catalog-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile scripts/publish_release.py scripts/build_hmod.py scripts/validate_catalog.py
      - name: Validate official catalogue and metadata
        run: python scripts/validate_catalog.py
      - name: Build and validate Ruby example
        run: python scripts/build_hmod.py

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download published HMOD assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p .release-assets
          gh release download "$RELEASE_TAG" --dir .release-assets --pattern '*.hmod'
      - name: Generate catalogue entries and verify package hashes
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_ASSETS: .release-assets
        run: python scripts/publish_release.py
      - name: Validate generated catalogue
        run: python scripts/validate_catalog.py
      - name: Commit catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/mods.json
          git diff --cached --quiet || git commit -m "chore(catalog): publish release ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
