name: Build and publish Vex Spark example

on:
  push:
    branches: [main]
    paths:
      - "examples/vex-spark/**"
      - ".github/workflows/build-vex-spark.yml"

permissions:
  contents: write

concurrency:
  group: vex-spark-example-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build HMOD
        run: python scripts/build_hmod.py --source examples/vex-spark --output target/horizon-mod/vex_spark.hmod
      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("examples/vex-spark/horizon-mod.toml", "rb"))["version"])')"
          if gh release view "vex-spark-$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; increase the mod version." >&2
            exit 1
          fi
          cp target/horizon-mod/vex_spark.hmod "target/horizon-mod/vex_spark-$VERSION.hmod"
          gh release create "vex-spark-$VERSION" "target/horizon-mod/vex_spark-$VERSION.hmod" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Vex Spark $VERSION" \
            --notes "Horizon EntityType API example. Built from examples/vex-spark; catalogue indexing runs after publication."
