name: Build and publish example Ruby mod

on:
  push:
    branches: [main]
    paths:
      - "examples/ruby-content/horizon-mod.toml"

permissions:
  contents: write

concurrency:
  group: ruby-example-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate example
        run: python scripts/build_hmod.py
      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("examples/ruby-content/horizon-mod.toml", "rb"))["version"])')"
          test -n "$VERSION"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Increase the mod version before publishing." >&2
            exit 1
          fi
          cp "target/horizon-mod/ruby.hmod" "target/horizon-mod/ruby-$VERSION.hmod"
          gh release create "v$VERSION" "target/horizon-mod/ruby-$VERSION.hmod" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ruby $VERSION" \
            --notes "Example Horizon Android content mod. The catalogue workflow validates the package and indexes its SHA-256."
